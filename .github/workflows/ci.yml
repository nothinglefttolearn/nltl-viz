name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cairo build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - uses: jdx/mise-action@v2
      - run: mise run lint
      - run: mise run test
