[project]
name = "nltl-viz"
version = "0.1.0"
description = "Audio-reactive generative visualizer for social media video clips"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "librosa>=0.10.1",
    "numpy>=1.26",
    "pycairo>=1.26",
    "pyyaml>=6.0",
    "questionary>=2.0",
    "soundfile>=0.12",
]

[project.scripts]
nltl-viz = "nltl_viz.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nltl_viz"]
