[tools]
python = "3.14"
uv = "latest"
ffmpeg = "latest" # provides ffprobe too

[env]
_.python.venv = { path = ".venv", create = true }

[settings]
python.uv_venv_auto = true

[tasks.sync]
description = "Install runtime + dev dependencies"
run = "uv sync --group dev"

[tasks.test]
description = "Run tests (pass pytest args after --, e.g. -- tests/test_ema.py)"
depends = ["sync"]
run = "uv run pytest"

[tasks.lint]
description = "Lint with ruff"
depends = ["sync"]
run = "uv run ruff check ."

[tasks.fmt]
description = "Format with ruff"
depends = ["sync"]
run = "uv run ruff format ."

[tasks.viz]
description = "Run nltl-viz (e.g. mise run viz -- --preview demo.wav)"
depends = ["sync"]
run = "uv run nltl-viz"
